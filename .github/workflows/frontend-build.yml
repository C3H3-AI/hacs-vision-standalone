name: Frontend Build Check

on:
  pull_request:
    paths:
      - "frontend_src/**"
  push:
    branches: [main, master]
    paths:
      - "frontend_src/**"

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci
        working-directory: frontend_src

      - name: Build
        run: npm run build
        working-directory: frontend_src

      - name: Check build output is up to date
        run: git diff --exit-code custom_components/hacs/vision/frontend/
